name: MusicRemote
options:
  deploymentTarget:
    iOS: "17.4"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MusicRemote:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: MusicRemote/App
    settings:
      base:
        INFOPLIST_FILE: MusicRemote/Configuration/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: personal.musicremote.prototype
        PRODUCT_NAME: MusicRemote
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - sdk: MusicKit.framework
      - sdk: Network.framework
      - sdk: MultipeerConnectivity.framework
  HotspotProbe:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: HotspotProbe
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: HotspotProbe/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: personal.musicremote.hotspotprobe
        PRODUCT_NAME: HotspotProbe
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - sdk: Network.framework
schemes:
  MusicRemote:
    build:
      targets:
        MusicRemote: all
  HotspotProbe:
    build:
      targets:
        HotspotProbe: all
